name: Local SAP interpreter probe
on:
  workflow_dispatch:
  push:
    branches: [codex/local-sap-tci]
permissions:
  contents: read
jobs:
  interpreter:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Naville/unicorn
          ref: 53471ef9cf480fab094bf13db3e5d2f9e2c30dc5
          path: unicorn
      - name: Build and execute interpreter on host
        run: |
          set -euo pipefail
          cmake -S unicorn -B build-host -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DUNICORN_BUILD_TESTS=OFF -DUNICORN_ARCH=x86 -DUNICORN_INTERPRETER=ON
          cmake --build build-host --parallel 3
          clang Experiments/LocalSAP/smoke.c -Iunicorn/include build-host/libunicorn.a -lpthread -lm -o build-host/smoke
          build-host/smoke
      - name: Cross compile interpreter for iOS 16 device
        run: |
          set -euo pipefail
          cmake -S unicorn -B build-ios -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DUNICORN_BUILD_TESTS=OFF -DUNICORN_ARCH=x86 -DUNICORN_INTERPRETER=ON
          cmake --build build-ios --parallel 3
          xcodebuild -create-xcframework -library build-ios/libunicorn.a -headers unicorn/include -output build-ios/UnicornTCI.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-ios16-unicorn-tci
          path: build-ios/UnicornTCI.xcframework
