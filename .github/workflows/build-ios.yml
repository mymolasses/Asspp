name: Build iOS artifact
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepare-xcode
        id: xcode
      - name: Restore tested SAP libraries
        id: sap
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/local-sap
          key: sap-ios-arm64-go1.25.7-cmake3.31.6-${{ runner.os }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('Experiments/LocalSAP/**') }}
      - uses: actions/setup-go@v5
        if: steps.sap.outputs.cache-hit != 'true'
        with:
          go-version: '1.25.7'
          cache: false
      - name: Prepare build tools
        env:
          SAP_CACHE_HIT: ${{ steps.sap.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ "$SAP_CACHE_HIT" != 'true' ]; then
            python3 -m venv "$RUNNER_TEMP/asspp-build-tools"
            "$RUNNER_TEMP/asspp-build-tools/bin/python" -m pip install --disable-pip-version-check 'cmake==3.31.6'
            echo "$RUNNER_TEMP/asspp-build-tools/bin" >> "$GITHUB_PATH"
          fi
          if ! command -v xcbeautify >/dev/null; then brew install xcbeautify; fi
      - name: Build and test local SAP bridge
        if: steps.sap.outputs.cache-hit != 'true'
        run: bash Experiments/LocalSAP/build.sh "$RUNNER_TEMP/local-sap"
      - name: Verify SAP library architectures
        run: |
          xcrun lipo "$RUNNER_TEMP/local-sap/libasspp-sap.a" -verify_arch arm64
          xcrun lipo "$RUNNER_TEMP/local-sap/libunicorn.a" -verify_arch arm64
      - name: Upload device SAP libraries
        uses: actions/upload-artifact@v4
        with:
          name: LocalSAP-ios-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/local-sap/
          if-no-files-found: error
          retention-days: 14
      - name: Restore Xcode build cache
        uses: actions/cache@v4
        with:
          path: build/DerivedDataApp
          key: xcode-ios-${{ runner.os }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('Asspp.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-ios-${{ runner.os }}-${{ steps.xcode.outputs.cache-key }}-${{ hashFiles('Asspp.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
      - name: Build iOS package
        env:
          LOCAL_SAP_LIBRARY_DIR: ${{ runner.temp }}/local-sap
        run: zsh Resources/Scripts/compile.release.mobile.ci.sh "$(pwd)" "$RUNNER_TEMP/Asspp.ipa"
      - name: Verify IPA and create checksum
        run: |
          python3 - <<'PYTHON'
          import hashlib, os, pathlib, plistlib, struct, zipfile
          ipa = pathlib.Path(os.environ['RUNNER_TEMP']) / 'Asspp.ipa'
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, 'Corrupt IPA archive'
              info = plistlib.loads(archive.read('Payload/Asspp.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'wiki.qaq.Asspp'
              assert 'iPhoneOS' in info['CFBundleSupportedPlatforms']
              assert 'Payload/Asspp.app/embedded.mobileprovision' not in archive.namelist(), 'Expected unsigned IPA'
              with archive.open('Payload/Asspp.app/' + info['CFBundleExecutable']) as executable:
                  magic, architecture = struct.unpack('<II', executable.read(8))
              assert magic == 0xfeedfacf and architecture == 0x0100000c
          ipa.with_suffix('.ipa.sha256').write_text(hashlib.sha256(ipa.read_bytes()).hexdigest() + '  Asspp.ipa\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: Asspp-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/Asspp.ipa
            ${{ runner.temp }}/Asspp.ipa.sha256
          if-no-files-found: error
          retention-days: 14
