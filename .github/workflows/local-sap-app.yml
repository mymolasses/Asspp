name: Local SAP iOS App
on:
  workflow_dispatch:
  push:
    branches: [codex/local-sap-tci]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - name: Build and test local SAP bridge
        run: bash Experiments/LocalSAP/build.sh "$RUNNER_TEMP/local-sap"
      - name: Build iOS App
        env:
          LOCAL_SAP_LIBRARY_DIR: ${{ runner.temp }}/local-sap
        run: bash Resources/Scripts/compile.release.mobile.ci.sh "$(pwd)" "$RUNNER_TEMP/Asspp-4.3.3-local.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Asspp-4.3.3-local
          path: ${{ runner.temp }}/Asspp-4.3.3-local.ipa
