name: Local SAP iOS App
run-name: Test IPA · ${{ github.ref_name }} · ${{ github.run_number }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-sap-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validation.yml
  build:
    uses: ./.github/workflows/build-ios.yml
