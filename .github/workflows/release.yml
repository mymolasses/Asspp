name: Release
on:
  push:
    tags:
      - "[0-9]*"
      - "v[0-9]*"
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validation:
    uses: ./.github/workflows/validation.yml
  build:
    uses: ./.github/workflows/build-ios.yml
  publish:
    needs: [validation, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Asspp-ios-${{ github.sha }}
          path: artifacts
      - name: Publish release and IPA
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" artifacts/Asspp.ipa artifacts/Asspp.ipa.sha256 --clobber
