name: Prepare Xcode
description: Select stable Xcode and identify the compiler and SDK for caches.
outputs:
  cache-key:
    description: Compiler and SDK fingerprint
    value: ${{ steps.xcode.outputs.cache-key }}
runs:
  using: composite
  steps:
    - id: xcode
      shell: bash
      run: |
        set -euo pipefail
        best_path=""
        best_ver=""
        for app in /Applications/Xcode*.app; do
          [ -d "$app" ] || continue
          info="$app/Contents/Info.plist"
          [ -f "$info" ] || continue
          # Skip beta/release-candidate installs.
          case "$(printf '%s' "$app" | tr '[:upper:]' '[:lower:]')" in
            *beta*|*_rc*) continue ;;
          esac
          ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info" 2>/dev/null || true)"
          [ -n "$ver" ] || continue
          if [ -z "$best_ver" ] || [ "$(printf '%s\n%s\n' "$best_ver" "$ver" | sort -V | tail -1)" = "$ver" ]; then
            best_ver="$ver"
            best_path="$app"
          fi
        done
        if [ -z "$best_path" ]; then
          echo "::error::No non-beta Xcode found"
          exit 1
        fi
        echo "Selected Xcode $best_ver at $best_path"
        sudo xcode-select -s "$best_path"
        xcodebuild -version
        xcrun --sdk iphoneos --show-sdk-path
        fingerprint="$( { xcodebuild -version; xcrun --sdk iphoneos --show-sdk-version; uname -m; } | shasum -a 256 | cut -d ' ' -f 1)"
        echo "cache-key=$fingerprint" >> "$GITHUB_OUTPUT"
